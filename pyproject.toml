[project]
name = "quanttrading"
version = "0.1.0"
description = "Quant trading system for Indian markets — Nifty 50 cross-sectional momentum (backtest + paper trading)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.1",
    "pyarrow>=15",
    "vectorbt>=0.27",
    "quantstats>=0.0.62",
    "fyers-apiv3>=3.1.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "apscheduler>=3.10",
    "pandas-market-calendars>=4.4",
    "scikit-learn>=1.5",
    "pyportfolioopt>=1.5.5",
    "pywebview>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "data",
    "strategy",
    "backtest",
    "execution",
    "portfolio",
    "live",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
